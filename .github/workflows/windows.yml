name: Windows desktop build
on:
  workflow_dispatch:
  push:
    branches: ["codex/**", main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: npm test
      - run: npm run prepare:windows
      - name: Test real media engine
        shell: pwsh
        run: |
          $env:VIDEO_COMPRESS_FFMPEG = "$PWD\src-tauri\binaries\ffmpeg.exe"
          $env:VIDEO_COMPRESS_FFPROBE = "$PWD\src-tauri\binaries\ffprobe.exe"
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
          if ($LASTEXITCODE -ne 0) { throw 'Engine tests failed' }
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked --test real_media -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Real media tests failed' }
      - run: npm run build:windows
      - name: Verify portable startup from Chinese path
        shell: pwsh
        run: ./scripts/test-portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FrameFold-Windows-x64
          path: |
            release/*.zip
            release/*.zip.sha256
          if-no-files-found: error
